# Cloudflare Workers config. Static site from the repo root; worker.js handles
# /api/chat (budget assistant) and /api/feedback, redirects and pretty paths.
name = "budzet-polski"
main = "worker.js"
compatibility_date = "2025-09-01"

# Main address: budzetpolski.com (added under Domains in the dashboard).
# workers.dev stays on so preview builds work; worker.js redirects the old
# production workers.dev address and www to budzetpolski.com.
workers_dev = true
preview_urls = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers AI (free daily allowance). Change the model with the AI_MODEL variable.
[ai]
binding = "AI"

# Rate limits for the chat assistant (Cloudflare Workers Rate Limiting, per visitor IP).
# namespace_id is any number unique within the account; period must be 10 or 60 seconds.
[[ratelimits]]
name = "CHAT_BURST"
namespace_id = "1001"
simple = { limit = 6, period = 10 }

[[ratelimits]]
name = "CHAT_MINUTE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
